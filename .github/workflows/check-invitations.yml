name: Check Alerts (Invitations & News)

on:
  schedule:
    # 20分おき(毎時7分・27分・47分)。
    # GitHub の定期実行は混み合うと遅れたり飛ばされたりする(1時間おきだと数時間動かないことがあった)ため、
    # 回数を増やし、混みやすい毎時0分・15分ちょうどを避ける。無料招待は募集期間が短いので早めに拾う
    - cron: '7,27,47 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 同じ処理が同時に2つ動くと保存(push)がぶつかるので、前の実行が終わるまで次は待たせる
concurrency:
  group: check-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run alert check
        id: alerts
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/check_alerts.py

      - name: Check official sites for invitations
        id: official
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/check_official_invites.py

      - name: Update schedule
        id: schedule
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/update_schedule.py

      - name: Run result check
        id: results
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/check_results.py

      - name: Build next-game previews
        id: previews
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/build_previews.py

      - name: Read Blowinds game-day pages
        id: gamelp
        # ブローウィンズの試合情報ページ(開場・当日スケジュール・イベント)。1つのサイトの不調で止まらないようにする
        continue-on-error: true
        run: python3 scripts/build_game_lp.py

      - name: Write status
        # アプリの「データの最終更新」表示用。各処理が成功したかどうかも残す
        env:
          S_ALERTS: ${{ steps.alerts.outcome }}
          S_OFFICIAL: ${{ steps.official.outcome }}
          S_SCHEDULE: ${{ steps.schedule.outcome }}
          S_RESULTS: ${{ steps.results.outcome }}
          S_PREVIEWS: ${{ steps.previews.outcome }}
          S_GAMELP: ${{ steps.gamelp.outcome }}
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          steps = {k: os.environ.get("S_" + k.upper(), "") for k in ["alerts", "official", "schedule", "results", "previews", "gamelp"]}
          with open("data/status.json", "w", encoding="utf-8") as f:
              json.dump({"updated_at": datetime.now(timezone.utc).isoformat(), "steps": steps}, f, ensure_ascii=False, indent=2)
          print(steps)
          PY

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/invitations_raw.json data/official_seen.json data/news_raw.json data/results.json data/games.json data/previews.json data/status.json
          # 選手の成績(初回に取得できなかったときはファイルが無いので、あるときだけ追加する)
          if [ -f data/players.json ]; then git add data/players.json; fi
          # ブローウィンズの試合情報ページ(初回に取得できなかったときはファイルが無いので、あるときだけ追加する)
          if [ -f data/game_lp.json ]; then git add data/game_lp.json; fi
          # 丸岡RUCK・ユナイテッドの順位表(初回に取得できなかったときはファイルが無いので、あるときだけ追加する)
          if [ -f data/standings.json ]; then git add data/standings.json; fi
          # 45日より前のニュースの保管庫(1年分)
          if [ -f data/news_archive.json ]; then git add data/news_archive.json; fi
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: 無料招待・ニュース・日程・結果・展望の自動更新"
          # 実行中に手元から(または別の実行が)pushしていても保存できるよう、最新を取り込んでからpushする。
          # 取り込んだ直後にほかのpushと重なって断られることがあるので、少し待って最大5回までやり直す
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main || git rebase --abort
            if git push; then
              echo "保存しました(${i}回目)"
              exit 0
            fi
            echo "pushが重なったので、$((i * 10))秒待ってやり直します"
            sleep $((i * 10))
          done
          echo "5回やり直しても保存できませんでした"
          exit 1
