name: Check Alerts (Invitations & News)

on:
  schedule:
    # 1時間おき(毎時15分ごろ)。無料招待は募集期間が短いので早めに拾う
    - cron: '15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run alert check
        run: python3 scripts/check_alerts.py

      - name: Check official sites for invitations
        run: python3 scripts/check_official_invites.py

      - name: Update schedule
        run: python3 scripts/update_schedule.py

      - name: Run result check
        run: python3 scripts/check_results.py

      - name: Build next-game previews
        run: python3 scripts/build_previews.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/invitations_raw.json data/official_seen.json data/news_raw.json data/results.json data/games.json data/previews.json
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: 無料招待・ニュース・日程・結果の自動更新"
          git push
