name: Check Alerts (Invitations & News)

on:
  schedule:
    # 1時間おき(毎時15分ごろ)。無料招待は募集期間が短いので早めに拾う
    - cron: '15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run alert check
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/check_alerts.py

      - name: Check official sites for invitations
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/check_official_invites.py

      - name: Update schedule
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/update_schedule.py

      - name: Run result check
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/check_results.py

      - name: Build next-game previews
        # 1つのサイトの不調で、後の処理と保存が止まらないようにする
        continue-on-error: true
        run: python3 scripts/build_previews.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/invitations_raw.json data/official_seen.json data/news_raw.json data/results.json data/games.json data/previews.json
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "chore: 無料招待・ニュース・日程・結果・展望の自動更新"
          # 実行中に手元からpushされていても保存できるよう、最新を取り込んでからpushする
          git pull --rebase -X theirs origin main || git rebase --abort
          git push
