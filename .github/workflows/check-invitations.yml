name: Check Alerts (Invitations & News)

on:
  schedule:
    # 6時間おき(UTC基準。日本時間の 3時, 9時, 15時, 21時ごろ)
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run alert check
        run: python3 scripts/check_alerts.py

      - name: Run result check
        run: python3 scripts/check_results.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/invitations_raw.json data/news_raw.json data/results.json
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: 無料招待・ニュース・結果の自動更新"
          git push
