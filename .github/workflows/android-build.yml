name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing key
        # Secret に登録した署名鍵を復元。毎回同じ鍵で署名されるので、アプリを消さずに上書きできる
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/fukuispo-debug.jks
            echo "署名鍵を復元しました"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 が未登録のため、毎回異なる鍵で署名されます(上書きインストール不可)"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fukui-teams-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
