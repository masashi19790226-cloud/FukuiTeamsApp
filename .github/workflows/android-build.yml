name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: '知人配布用にReleasesへ公開する'
        type: boolean
        default: false
      notes:
        description: '更新内容(配布ページに表示されます・省略可)'
        type: string
        default: ''

# Releases を作るための書き込み権限
permissions:
  contents: write

jobs:
  build:
    # ubuntu-latest は Ubuntu 26 に切り替わっていくため、急にビルドが変わらないよう版を固定する(2026年10月)
    runs-on: ubuntu-24.04
    steps:
      # 部品(actions)は Node.js 24 で動く版を使う(Node.js 20 の版は非推奨になったため。2026年10月)
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        # v6 は利用規約が変わった(キャッシュ機能が非公開の部品になった)ため、Node.js 24 で動く v5 を使う
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      - name: Restore signing key
        # Secret に登録した署名鍵を復元。毎回同じ鍵で署名されるので、アプリを消さずに上書きできる
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/fukuispo-debug.jks
            echo "署名鍵を復元しました"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 が未登録のため、毎回異なる鍵で署名されます(上書きインストール不可)"
          fi

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      # APK のファイル名を「fukuispo-v版.apk」にする(例:fukuispo-v2.152.apk)
      # 版はアプリの versionName と同じ「先頭の数字.実行番号」。先頭の数字は gradle.properties の fukuispo.versionMajor
      - name: Rename APK
        id: apkname
        run: |
          MAJOR=$(grep '^fukuispo.versionMajor=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          APP_VERSION="${MAJOR:-2}.${GITHUB_RUN_NUMBER}"
          NAME="fukuispo-v${APP_VERSION}"
          cp app/build/outputs/apk/debug/app-debug.apk "${NAME}.apk"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      # APK を ZIP に固めずそのまま置く(Actions の画面からダウンロードすると fukuispo-v版.apk がそのまま落ちてくる)
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.apkname.outputs.name }}.apk
          archive: false

      # ここから下は「Run workflow」で公開にチェックを入れたときだけ動く
      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::署名鍵のSecretが未登録です。この状態で配ると、次の版に上書き更新できないため公開を中止しました"
            exit 1
          fi
          VERSION="${{ steps.apkname.outputs.version }}"
          APK="${{ steps.apkname.outputs.name }}.apk"
          # 固定のダウンロードリンク(releases/latest/download/fukuispo.apk)用に、従来の名前のファイルも置く
          cp "$APK" fukuispo.apk
          BODY="${NOTES:-更新しました}"
          BODY="${BODY}

          ### インストール方法
          下の **${APK}** をタップしてダウンロードし、開いてインストールしてください(fukuispo.apk も同じ中身です)。
          初回は「この提供元のアプリを許可」を求められるので、許可してください。
          すでに入っている場合は、同じ手順で上書き更新できます(データは消えません)。"
          gh release create "v${VERSION}" "$APK" fukuispo.apk \
            --title "ふくスポ v${VERSION}" \
            --notes "$BODY" \
            --latest
          echo "公開しました: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
