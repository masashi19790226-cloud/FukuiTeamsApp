name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish:
        description: '知人配布用にReleasesへ公開する'
        type: boolean
        default: false
      notes:
        description: '更新内容(配布ページに表示されます・省略可)'
        type: string
        default: ''

# Releases を作るための書き込み権限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Restore signing key
        # Secret に登録した署名鍵を復元。毎回同じ鍵で署名されるので、アプリを消さずに上書きできる
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/fukuispo-debug.jks
            echo "署名鍵を復元しました"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 が未登録のため、毎回異なる鍵で署名されます(上書きインストール不可)"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fukui-teams-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ここから下は「Run workflow」で公開にチェックを入れたときだけ動く
      - name: Publish to GitHub Releases
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::署名鍵のSecretが未登録です。この状態で配ると、次の版に上書き更新できないため公開を中止しました"
            exit 1
          fi
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/debug/app-debug.apk fukuispo.apk
          BODY="${NOTES:-更新しました}"
          BODY="${BODY}

          ### インストール方法
          下の **fukuispo.apk** をタップしてダウンロードし、開いてインストールしてください。
          初回は「この提供元のアプリを許可」を求められるので、許可してください。
          すでに入っている場合は、同じ手順で上書き更新できます(データは消えません)。"
          gh release create "v${VERSION}" fukuispo.apk \
            --title "ふくスポ v${VERSION}" \
            --notes "$BODY" \
            --latest
          echo "公開しました: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
